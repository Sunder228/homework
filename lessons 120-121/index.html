<!doctype html>
<html class="page" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <script src="./js/index.js" type="module"></script>
    <title>California</title>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="container header__container">
        <a class="logo header__logo" href="#">
          <img
            class="logo__img"
            src="./icons/logo-icon.svg"
            width="170"
            height="21"
            alt="Logotype California"
          />
        </a>
        <nav class="menu header__menu" id="header__menu" aria-label="Main menu">
          <ul class="menu__list">
            <li class="menu__item">
              <a class="menu__link" href="#all-products">all products</a>
            </li>
            <li class="menu__item">
              <button
                class="solutions__button"
                title="Solutions"
                aria-label="Solutions"
              >
                SOLUTIONS
                <div class="solutions__mark">
                  <svg width="12" height="8">
                    <use
                      class="solutions__icon"
                      href="./icons/sprite.svg#check-mark"
                    ></use>
                  </svg>
                </div>
                <!-- <div class="dropdown-menu">
                  <a class="dropdown-link" href="#phones">Phones</a
                  ><a class="dropdown-link" href="#tablets">Tablets</a
                  ><a class="dropdown-link" href="#watches">Watches</a
                  ><a class="dropdown-link" href="#laptops">Laptops</a>
                </div> -->
              </button>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#about">about</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#support">support</a>
            </li>
          </ul>
        </nav>
        <div class="header__controls">
          <div class="header__actions">
            <button
              class="header__actions-button"
              title="Search"
              aria-label="Search"
            >
              <svg width="24" height="24">
                <use
                  class="header__actions-icon"
                  href="./icons/sprite.svg#search"
                ></use>
              </svg>
            </button>
            <button
              class="header__actions-button"
              title="Cart"
              aria-label="Cart"
            >
              <svg width="24" height="24">
                <use
                  class="header__actions-icon"
                  href="./icons/sprite.svg#cart"
                ></use>
              </svg>
            </button>
            <button
              class="header__burger burger"
              aria-label="Open menu"
              aria-expanded="false"
              aria-controls="header__menu"
            >
              <svg width="24" height="24">
                <use
                  class="burger__icon-menu"
                  href="./icons/sprite.svg#menu-burger"
                ></use>
                <use
                  class="burger__icon-cross"
                  href="./icons/sprite.svg#cross"
                ></use>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
